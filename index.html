<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<link rel="icon" type="image/png" href="school-hub-icon.png">
<link rel="apple-touch-icon" href="school-hub-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="school-hub">

        <header class="page-header">
            <h1>School Hub</h1>
        </header>

        <section class="students">

            <section class="student-card" id="eddie-card">
                <h2>Eddie</h2>

                <div class="student-info">
                    <div>
                        <h3>Current Class</h3>
                        <p id="eddie-current">—</p>
                    </div>

                    <div>
                        <h3>Next Class</h3>
                        <p id="eddie-next">—</p>
                    </div>
                </div>

                <details>
                    <summary>Today's Schedule</summary>
                    <div id="eddie-schedule"></div>
                </details>

                <details>
                    <summary>Bus Schedule</summary>
                    <div id="eddie-bus"></div>
                </details>
            </section>


            <section class="student-card" id="elena-card">
                <h2>Elena</h2>

                <div class="student-info">
                    <div>
                        <h3>Current Class</h3>
                        <p id="elena-current">—</p>
                    </div>

                    <div>
                        <h3>Next Class</h3>
                        <p id="elena-next">—</p>
                    </div>

                    <div>
                        <h3>Today's Resource</h3>
                        <p id="elena-resource">—</p>
                    </div>
                </div>

                <details>
                    <summary>Today's Schedule</summary>
                    <div id="elena-schedule"></div>
                </details>

                <details>
                    <summary>Bus Schedule</summary>
                    <div id="elena-bus"></div>
                </details>
            </section>

        </section>


        <section class="today-card">

    <h2>Today</h2>

    <p id="today-date">—</p>

    <p id="early-release"></p>

    <div id="school-events">
        Checking school calendar...
    </div>

</section>


        <section class="school-info">

            <h2>School Info</h2>

            <details>
                <summary>Otis Mason Elementary School</summary>
                <div id="mason-info"></div>
            </details>

            <details>
                <summary>Gamble Rogers Middle School</summary>
                <div id="gamble-info"></div>
            </details>

        </section>

    </main>


    <script src="resource.js"></script>
    <script src="calendar.js"></script>
    <script src="app.js"></script>

</body>
</html>
